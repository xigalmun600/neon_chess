  name: Deploy to VPS

  on:
    push:
      branches: [main]
    workflow_dispatch:

  concurrency:
    group: deploy-production
    cancel-in-progress: false

  jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Deploy over SSH
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            script_stop: true
            script: |
              set -euo pipefail
              cd /srv/neon-chess
              git fetch --all --prune
              git reset --hard origin/main
              npm ci
              npm run build
              sudo /bin/systemctl restart neon-chess
              sudo /bin/systemctl is-active neon-chess