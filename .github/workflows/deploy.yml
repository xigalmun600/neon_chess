name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /srv/neon-chess
            git fetch --all --prune
            git reset --hard origin/main
            nix develop --command npm ci
            set -a
            source /etc/neon-chess.env
            set +a
            nix develop --command npm run build
            nix develop --command psql -f db/tables.sql
            sudo /bin/systemctl restart neon-chess </dev/null
            sudo /bin/systemctl is-active neon-chess </dev/null
